name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --release --bin vlsv_ptr_gc2d --features=vlsv_ptr -- --nocapture

  run_testpackage:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13","3.14"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv venv CI_env
        . CI_env/bin/activate
        uv pip install .
        uv pip install git+https://github.com/fmihpc/analysator.git@dev
    - name: Build
      run: 
    - name: Run tests
      run: |
        . CI_env/bin/activate
        python ./testpackage/testpackage_functions.py
        python ./testpackage/testpackage_vlsvread_basic.py

